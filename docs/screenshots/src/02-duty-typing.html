<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mock-up: In-duty typing</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      .dalamud-window {
        top: 48px;
        right: 48px;
        width: 340px;
      }
      .ep1 { top: 220px; left: 180px; }
      .ep2 { top: 280px; left: 520px; }
      .ep3 { top: 340px; left: 860px; }
    </style>
  </head>
  <body>
    <div class="game-backdrop"></div>
    <div class="duty-title">Keybound Brawler · Territory 1359</div>
    <div class="mockup-banner">Mock-up</div>
    <div class="scene-label">In-duty prompt fill — KTGInput field, shortest-target highlight</div>

    <div class="duty-hud">
      <div class="enemy-prompt ep1 shortest">bolt</div>
      <div class="enemy-prompt ep2">thunderclap</div>
      <div class="enemy-prompt ep3">meteor</div>
      <div class="input-bar">bo<span class="cursor"></span></div>
    </div>

    <div class="dalamud-window">
      <div class="dalamud-title">Keybound Assist</div>
      <div class="dalamud-body">
        <p class="status-line">Typing 'bolt'.</p>
      </div>
    </div>
  </body>
</html>
